name: Publish immutable application image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: telnexa-web-release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/telnexa-web

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Require reviewed dependency lock
        run: test -f package-lock.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact-SHA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            NUXT_PUBLIC_RELEASE_SHA=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable release identity
        run: |
          mkdir -p evidence
          {
            echo "RELEASE_SHA=${GITHUB_SHA}"
            echo "IMAGE=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo "WORKFLOW_RUN=${GITHUB_RUN_ID}"
            echo "LIVE_SMS_DELIVERY=false"
            echo "LIVE_EMAIL_DELIVERY=false"
            echo "LIVE_PSTN_DIALING=false"
          } | tee evidence/release.env

      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: evidence/release.env
          retention-days: 30
