name: Hydrate validated Telnexa source

on:
  push:
    branches:
      - feat/nuxt-production-platform
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: hydrate-telnexa-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: https://registry.npmjs.org
      - name: Reassemble and verify reviewed source
        run: |
          cat bootstrap/source.tar.gz.part-* > /tmp/telnexa-source.tar.gz
          echo "3a708e464b5ba5041a5e73e4b50789c0184040293010e449d01d3d204540ae0d  /tmp/telnexa-source.tar.gz" | sha256sum -c -
          if tar -tzf /tmp/telnexa-source.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path" >&2
            exit 1
          fi
          tar -xzf /tmp/telnexa-source.tar.gz --no-same-owner
          rm -rf bootstrap .github/workflows/hydrate-source.yml
      - name: Validate source contracts before dependency execution
        run: |
          node scripts/validate-manifests.mjs
          node scripts/validate-source.mjs
          node --test tests/contracts/*.test.mjs
          bash -n deployment/scripts/*.sh
          python3 -m py_compile deployment/scripts/render-kong.py
      - name: Install and lock exact dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete validation and contract tests
        run: |
          npm run validate
          npm test
      - name: Build production output
        env:
          NUXT_PUBLIC_SITE_URL: https://telnexa.co
          NUXT_PUBLIC_API_BASE: /api
          NUXT_PUBLIC_ENVIRONMENT: test
          NUXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Boot and smoke production output
        env:
          NITRO_HOST: 127.0.0.1
          NITRO_PORT: 3000
          NUXT_DEV_FORM_SINK_ENABLED: 'true'
          NUXT_PUBLIC_ENVIRONMENT: test
          NUXT_PUBLIC_SITE_URL: https://telnexa.co
          NUXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
        run: |
          node .output/server/index.mjs > /tmp/telnexa-web.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz
          npm run test:pages
          npm run test:forms
      - name: Commit complete reviewed application
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: implement production Telnexa Nuxt platform"
          git push origin "HEAD:${TARGET_BRANCH}"
