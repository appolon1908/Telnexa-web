name: Bootstrap exact dependency lock

on:
  push:
    branches:
      - feat/nuxt-production-platform

permissions:
  contents: write
  issues: write

concurrency:
  group: telnexa-web-bootstrap-lock
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Confirm the branch still needs a lock
        id: lock
        run: |
          if [[ -f package-lock.json ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate exact dependency graph
        id: generate
        if: steps.lock.outputs.needed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          node --version | tee /tmp/npm-lock.log
          npm --version | tee -a /tmp/npm-lock.log
          npm view nuxt@4.5.2 version 2>&1 | tee -a /tmp/npm-lock.log
          for attempt in 1 2 3; do
            echo "npm lock attempt ${attempt}" | tee -a /tmp/npm-lock.log
            if npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee -a /tmp/npm-lock.log; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Publish bounded failure diagnostics to PR 1
        if: steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Dependency-lock bootstrap failure'
            echo
            echo 'Exact runner output from the latest application head:'
            echo
            echo '```text'
            tail -n 120 /tmp/npm-lock.log
            echo '```'
          } >/tmp/npm-lock-comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -F body=@/tmp/npm-lock-comment.md
          exit 1
      - name: Remove one-time workflow and commit lock
        if: steps.lock.outputs.needed == 'true' && steps.generate.outcome == 'success'
        run: |
          rm .github/workflows/bootstrap-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A package-lock.json .github/workflows/bootstrap-lock.yml
          git commit -m "build: lock Nuxt dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
